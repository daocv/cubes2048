# Nginx reverse proxy cho Cubes2048 (tu chon)
# Dung neu muon HTTPS (wss://) + domain
#
# Cai dat:
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo nano /etc/nginx/sites-available/cubes2048
#   sudo ln -s /etc/nginx/sites-available/cubes2048 /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d domain.cua.ban
#   sudo nginx -t && sudo systemctl reload nginx

upstream cubes2048_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name domain.cua.ban;  # <<< SUA LAI

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    location / {
        proxy_pass http://cubes2048_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}